spring:
  application:
    name: ledgerflow
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ledgerflow}?options=-c%20TimeZone=UTC
    username: ${POSTGRES_USER:payment_user}
    password: ${POSTGRES_PASSWORD:payment_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LedgerFlowHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ledgerflow-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

ledgerflow:
  sandbox:
    admin-secret: ${SANDBOX_ADMIN_SECRET:sandbox_master_key_9981}
  outbox:
    polling-rate-ms: 1000
    batch-size: 50
  webhook:
    dispatcher-enabled: ${WEBHOOK_DISPATCHER_ENABLED:true}
    max-retries: ${WEBHOOK_MAX_RETRIES:3}
    connect-timeout-ms: ${WEBHOOK_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${WEBHOOK_READ_TIMEOUT_MS:5000}
